settings:
  tau_bank: 0.07
  tau_cls: 1.0
  sigma_min: 0.15
  sigma_max: 0.45
  object_filter_weight: 0.05
  ema_momentum: 0.95
  ema_min_count: 8
  loss_clip_teacher_weight: 0.005
  union_teacher_weight: 1.0
  subobj_teacher_weight: 0.5
  debug_interval: 100

semantic_bank_axes:
  - name: overlap
    prompts:
      - "a photo where the subject and object overlap or occlude each other"
      - "a visual relationship where two objects touch or cover the same image region"
  - name: interaction
    prompts:
      - "a photo where the subject is actively interacting with the object"
      - "a visual relationship where one object acts on another object"
  - name: surface_support
    prompts:
      - "a photo where the subject is resting on the object"
      - "a visual relationship where one object is supported by another object"
  - name: vertical_above
    prompts:
      - "a photo where the subject is visually above the object"
      - "a scene where one object is higher than another object"
  - name: containment
    prompts:
      - "a photo where the subject is inside the object"
      - "a visual relationship where one object is enclosed by another object"
  - name: attachment
    prompts:
      - "a photo where the subject is physically attached to the object"
      - "a visual relationship where one object is connected to another object"
  - name: possession
    prompts:
      - "a photo where the subject carries or possesses the object"
      - "a visual relationship where one object has another object"
  - name: hand_contact
    prompts:
      - "a photo where the subject is holding the object"
      - "a visual relationship where the subject grasps or touches the object"
  - name: body_wear
    prompts:
      - "a photo where the object is worn on the subject body"
      - "a visual relationship where clothing or an accessory is on a person"
  - name: locomotion
    prompts:
      - "a photo where the subject is moving through the scene"
      - "a visual relationship where one object walks or moves across another area"
  - name: riding
    prompts:
      - "a photo where the subject is riding the object"
      - "a visual relationship where one object is transported by another object"
  - name: looking
    prompts:
      - "a photo where the subject is looking at the object"
      - "a visual relationship where attention is directed toward another object"
  - name: eating
    prompts:
      - "a photo where the subject is eating the object"
      - "a visual relationship where one object bites or consumes another object"
  - name: covering
    prompts:
      - "a photo where the subject covers the object"
      - "a visual relationship where one object hides part of another object"
  - name: material_part
    prompts:
      - "a photo where the subject is part of the object"
      - "a visual relationship where one object is made of another object"
  - name: frontal_position
    prompts:
      - "a photo where the subject is in front of the object"
      - "a visual relationship where one object appears before another object"
  - name: proximity
    prompts:
      - "a photo where the subject is near the object"
      - "a visual relationship where two objects are close to each other"
  - name: direction_to
    prompts:
      - "a photo where the subject points or moves toward the object"
      - "a visual relationship where one object is directed to another object"
  - name: road_or_ground
    prompts:
      - "a photo where the subject is on a road ground or path"
      - "a visual relationship where an object rests on the ground surface"
  - name: decoration_symbol
    prompts:
      - "a photo where the subject is printed or painted on the object"
      - "a visual relationship where an image word or symbol appears on an object"
  - name: natural_growth
    prompts:
      - "a photo where the subject grows on the object"
      - "a visual relationship where a plant or natural part grows from another object"
  - name: semantic_association
    prompts:
      - "a photo where the subject and object belong together in the same scene"
      - "a visual relationship where two objects are meaningfully associated"

