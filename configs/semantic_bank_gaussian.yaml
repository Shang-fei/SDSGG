    - "no visual relationship between subject and object"
  above:
    - "subject is above object"
    - "subject is located higher than object"
  across:
    - "subject extends or moves across object"
    - "subject crosses from one side of object to another"
  against:
    - "subject touches and leans against object"
    - "subject is pressed against object"
  along:
    - "subject follows the length or direction of object"
    - "subject is positioned along object"
  and:
    - "subject appears together with object"
    - "subject and object are jointly present"
  at:
    - "subject is located at object"
    - "subject is positioned near the place of object"
  attached to:
    - "subject is physically attached to object"
    - "subject is connected to object"
  behind:
    - "subject is behind object"
    - "object is in front of subject"
  belonging to:
