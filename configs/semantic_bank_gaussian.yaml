settings:
  tau_bank: 0.07
  tau_cls: 1.0
  sigma_min: 0.06
  sigma_max: 0.35
  entropy_weight: 0.5
  uncertainty_weight: 0.3
  text_variance_weight: 0.2
  loss_nll_weight: 0.05
  loss_prior_weight: 0.05
  loss_clip_raw_weight: 0.05
  object_filter_weight: 0.05

semantic_bank_axes:
  - name: overlap
    positive: "two objects partially overlap or occlude each other"
    negative: "two objects are clearly separated with visible space"
  - name: interaction
    positive: "subject and object have an active interaction"
    negative: "subject and object have no visible interaction"
  - name: surface_support
    positive: "subject is supported by the surface of object"
    negative: "subject is not supported by object"
  - name: vertical_above
    positive: "subject is spatially above object"
    negative: "subject is spatially below object"
  - name: containment
    positive: "subject is inside or enclosed by object"
    negative: "subject is outside object"
  - name: attachment
    positive: "subject is physically attached or connected to object"
    negative: "subject is detached from object"
  - name: possession
    positive: "subject possesses or carries object"
    negative: "subject does not possess or carry object"
  - name: hand_contact
    positive: "subject grasps or holds object with a hand or similar part"
    negative: "subject is not grasping object"
  - name: body_wear
    positive: "object is worn on the body of subject"
    negative: "object is not worn by subject"
  - name: locomotion
    positive: "subject moves through or across object or scene"
    negative: "subject remains stationary"
  - name: riding
    positive: "subject rides or is transported by object"
    negative: "subject is not riding object"
  - name: looking
    positive: "subject directs visual attention toward object"
    negative: "subject looks away from object"
  - name: eating
    positive: "subject consumes or bites object"
    negative: "subject does not consume object"
  - name: covering
    positive: "subject covers object or object is covered by subject"
    negative: "object remains uncovered"
  - name: material_part
    positive: "subject is a part or material of object"
    negative: "subject is independent from object"
  - name: frontal_position
    positive: "subject is in front of object"
    negative: "subject is behind object"
  - name: proximity
    positive: "subject is near object"
    negative: "subject is far from object"
  - name: direction_to
    positive: "subject is directed toward object"
    negative: "subject is directed away from object"
  - name: road_or_ground
    positive: "subject is located on a road ground or path"
    negative: "subject is off the road or ground path"
  - name: decoration_symbol
    positive: "subject is printed painted or displayed on object"
    negative: "subject is not printed painted or displayed on object"
  - name: natural_growth
    positive: "subject grows from or on object"
    negative: "subject does not grow from object"
  - name: semantic_association
    positive: "subject and object are semantically associated"
    negative: "subject and object are unrelated"

predicate_descriptions:
