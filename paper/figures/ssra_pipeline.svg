<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f4ed8"/>
    </marker>
    <marker id="arrow_gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#68758a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#dcecff"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d7f7e8"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 40px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 21px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .section { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .label { font: 650 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .math { font: 600 18px "Times New Roman", serif; fill: #334155; }
      .box { fill: white; stroke: #d8e0eb; stroke-width: 2; filter: url(#shadow); }
      .blue { fill: url(#blueGrad); stroke: #98bdf9; stroke-width: 2; filter: url(#shadow); }
      .green { fill: url(#greenGrad); stroke: #92d6b4; stroke-width: 2; filter: url(#shadow); }
      .amber { fill: url(#amberGrad); stroke: #fdba74; stroke-width: 2; filter: url(#shadow); }
      .loss { fill: #fff; stroke: #ef4444; stroke-width: 2.2; stroke-dasharray: 7 6; filter: url(#shadow); }
      .arrow { stroke: #1f4ed8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow2 { stroke: #68758a; stroke-width: 2.5; fill: none; marker-end: url(#arrow_gray); }
      .dash { stroke: #ef4444; stroke-width: 2.4; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow_gray); }
      .softline { stroke: #cbd5e1; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="980"/>

  <text x="70" y="72" class="title">SSRA Pipeline: Semantic-Structural Relation Adaptation</text>
  <text x="70" y="108" class="subtitle">SDSGG backbone + low-rank semantic adaptation + structure-preserving alignment + SHIP-based novel relation generation</text>

  <!-- section bands -->
  <rect x="60" y="145" width="515" height="42" rx="12" fill="#e8f0ff"/>
  <text x="82" y="173" class="section">Inputs and SDSGG Backbone</text>
  <rect x="625" y="145" width="530" height="42" rx="12" fill="#e8f7ef"/>
  <text x="647" y="173" class="section">Semantic-Structural Adaptation</text>
  <rect x="1205" y="145" width="530" height="42" rx="12" fill="#fff2df"/>
  <text x="1227" y="173" class="section">Prediction and Training Signals</text>

  <!-- input image card -->
  <rect x="75" y="230" width="250" height="210" rx="22" class="box"/>
  <text x="105" y="270" class="label">Input Image</text>
  <text x="105" y="298" class="small">GT boxes + labels</text>
  <rect x="105" y="325" width="170" height="85" rx="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="145" cy="365" r="18" fill="#60a5fa"/>
  <rect x="181" y="344" width="57" height="43" rx="7" fill="#34d399"/>
  <path d="M113 408 L154 378 L188 397 L222 360 L270 408 Z" fill="#94a3b8"/>
  <text x="105" y="468" class="tiny">PredCls setting</text>

  <!-- object pair card -->
  <rect x="75" y="505" width="250" height="210" rx="22" class="box"/>
  <text x="105" y="545" class="label">Object Pair</text>
  <text x="105" y="573" class="small">subject-object candidates</text>
  <circle cx="145" cy="635" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <circle cx="245" cy="635" r="30" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <path d="M176 635 C190 610, 202 610, 214 635" stroke="#1f4ed8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="132" y="641" class="tiny">subj</text>
  <text x="234" y="641" class="tiny">obj</text>
  <text x="105" y="685" class="tiny">relation feature candidate</text>

  <!-- SDSGG backbone -->
  <rect x="395" y="300" width="245" height="250" rx="26" class="blue"/>
  <text x="428" y="343" class="label">SDSGG</text>
  <text x="428" y="373" class="small">relation feature extractor</text>
  <rect x="428" y="408" width="170" height="42" rx="12" fill="#ffffff" stroke="#b7cdf8"/>
  <text x="447" y="435" class="small">visual feature v</text>
  <rect x="428" y="465" width="170" height="42" rx="12" fill="#ffffff" stroke="#b7cdf8"/>
  <text x="446" y="492" class="small">text descriptions</text>
  <text x="428" y="532" class="tiny">base relation supervision</text>

  <path class="arrow" d="M325 335 C350 335, 365 350, 395 375"/>
  <path class="arrow" d="M325 610 C350 610, 365 545, 395 500"/>

  <!-- semantic branch -->
  <rect x="710" y="230" width="295" height="220" rx="26" class="green"/>
  <text x="745" y="273" class="label">SVD Semantic Basis</text>
  <text x="745" y="303" class="small">low-rank predicate structure</text>
  <text x="745" y="345" class="math">T ≈ U<tspan baseline-shift="sub" font-size="13">r</tspan>Σ<tspan baseline-shift="sub" font-size="13">r</tspan>V<tspan baseline-shift="super" font-size="13">T</tspan><tspan baseline-shift="sub" font-size="13">r</tspan></text>
  <g transform="translate(760,372)">
    <circle cx="15" cy="35" r="8" fill="#2563eb"/>
    <circle cx="70" cy="25" r="8" fill="#2563eb"/>
    <circle cx="115" cy="52" r="8" fill="#2563eb"/>
    <circle cx="172" cy="35" r="8" fill="#f59e0b"/>
    <path d="M15 35 L70 25 L115 52" stroke="#2563eb" stroke-width="2" fill="none"/>
    <path d="M115 52 L172 35" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="5 5"/>
  </g>

  <!-- visual projection -->
  <rect x="710" y="525" width="295" height="190" rx="26" class="blue"/>
  <text x="745" y="568" class="label">Visual Relation Space</text>
  <text x="745" y="598" class="small">projected relation features</text>
  <rect x="750" y="632" width="210" height="40" rx="12" fill="#ffffff" stroke="#b7cdf8"/>
  <text x="782" y="658" class="small">q = f(v)</text>

  <path class="arrow" d="M640 410 C675 385, 690 345, 710 335"/>
  <path class="arrow" d="M640 480 C680 520, 690 560, 710 595"/>

  <!-- structure alignment loss -->
  <rect x="1090" y="365" width="300" height="230" rx="28" class="loss"/>
  <text x="1127" y="410" class="label">Structure Loss</text>
  <text x="1127" y="440" class="small">preserve predicate geometry</text>
  <text x="1127" y="482" class="math">S<tspan baseline-shift="sub" font-size="13">visual</tspan> ≈ S<tspan baseline-shift="sub" font-size="13">text</tspan></text>
  <line x1="1140" y1="520" x2="1335" y2="520" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="1160" cy="520" r="7" fill="#2563eb"/>
  <circle cx="1215" cy="500" r="7" fill="#2563eb"/>
  <circle cx="1270" cy="535" r="7" fill="#2563eb"/>
  <circle cx="1325" cy="512" r="7" fill="#f59e0b"/>
  <text x="1127" y="568" class="tiny">avoid distorted visual-text mapping</text>

  <path class="dash" d="M1005 340 C1048 350, 1060 385, 1090 420"/>
  <path class="dash" d="M1005 630 C1055 610, 1060 565, 1090 525"/>

  <!-- SHIP generation -->
  <rect x="1110" y="675" width="285" height="180" rx="26" class="amber"/>
  <text x="1142" y="718" class="label">SHIP Generator</text>
  <text x="1142" y="748" class="small">novel relation feature synthesis</text>
  <rect x="1145" y="780" width="95" height="38" rx="11" fill="#fff" stroke="#fdba74"/>
  <text x="1163" y="805" class="tiny">text z</text>
  <path d="M1244 799 L1300 799" class="arrow2"/>
  <rect x="1308" y="780" width="52" height="38" rx="11" fill="#fff" stroke="#fdba74"/>
  <text x="1323" y="805" class="tiny">v*</text>
  <text x="1142" y="837" class="tiny">extra signal for novel predicates</text>

  <path class="arrow2" d="M1005 635 C1045 650, 1070 695, 1110 735"/>
  <path class="arrow2" d="M1005 335 C1070 430, 1095 580, 1135 675"/>

  <!-- prediction head -->
  <rect x="1495" y="355" width="235" height="245" rx="28" class="box"/>
  <text x="1530" y="400" class="label">Predicate Head</text>
  <text x="1530" y="430" class="small">relation classification</text>
  <rect x="1530" y="468" width="160" height="40" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1577" y="494" class="tiny">base</text>
  <rect x="1530" y="523" width="160" height="40" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1572" y="549" class="tiny">novel</text>
  <text x="1530" y="587" class="tiny">R@20 / R@50 / R@100</text>

  <path class="arrow" d="M1390 480 C1430 480, 1450 480, 1495 480"/>
  <path class="arrow2" d="M1395 765 C1440 720, 1465 630, 1495 550"/>

  <!-- losses -->
  <rect x="1488" y="690" width="245" height="160" rx="24" fill="#fff" stroke="#fecaca" stroke-width="2.2" stroke-dasharray="7 6" filter="url(#shadow)"/>
  <text x="1525" y="735" class="label">Training Objective</text>
  <text x="1525" y="775" class="math">L = L<tspan baseline-shift="sub" font-size="13">rel</tspan> + λ<tspan baseline-shift="sub" font-size="13">s</tspan>L<tspan baseline-shift="sub" font-size="13">str</tspan> + λ<tspan baseline-shift="sub" font-size="13">g</tspan>L<tspan baseline-shift="sub" font-size="13">ship</tspan></text>
  <text x="1525" y="820" class="tiny">classification + structure + generation</text>

  <path class="dash" d="M1255 595 C1310 670, 1400 735, 1488 755"/>
  <path class="dash" d="M1395 810 C1435 815, 1455 810, 1488 795"/>

  <!-- bottom legend -->
  <rect x="70" y="890" width="1660" height="55" rx="18" fill="#ffffff" stroke="#d8e0eb" stroke-width="2"/>
  <circle cx="105" cy="918" r="8" fill="#1f4ed8"/>
  <text x="125" y="924" class="small">main inference path</text>
  <circle cx="320" cy="918" r="8" fill="#ef4444"/>
  <text x="340" y="924" class="small">training constraints</text>
  <circle cx="560" cy="918" r="8" fill="#f59e0b"/>
  <text x="580" y="924" class="small">novel relation generation</text>
  <text x="910" y="924" class="small">Key idea: preserve predicate semantic structure while adapting relation representations to visual interactions.</text>
</svg>
